# Gitleaks configuration for My Study Guide.
#
# Extends gitleaks' built-in rule set and adds a NARROW allowlist for a known,
# non-secret value that the default rules would otherwise flag. Prefer adding a
# tightly scoped entry here over disabling the CI secret-scan job (.github/
# workflows/ci.yml). Only genuinely public / non-credential values belong here.

# Use all of gitleaks' default rules as the baseline.
[extend]
useDefault = true

[allowlist]
description = "Known non-secret values that are safe to appear in the repo/history"
# Matched against the detected secret value, so it suppresses this string
# wherever it appears (current code and older commits alike).
regexes = [
  # YouTube's PUBLIC InnerTube web-client API key — the SAME value youtube.com
  # ships in every browser page to call its internal player API. It is NOT one
  # of our private credentials (no Google project or billing is attached), which
  # is exactly why it can appear in client-side code at all. It is used by
  # backend/src/controllers/aiController.js (now assembled from parts) and also
  # existed as a single "AIza…" literal across older commits, so gitleaks' GCP
  # API-key rule flags it. Allowlisted by its exact value.
  '''AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8''',
]
