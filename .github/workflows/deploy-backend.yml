name: Deploy backend to Oracle VM

# Auto-deploys the backend to the self-hosted Oracle Cloud VM whenever backend
# code lands on main. Frontend deploys are handled separately (Cloudflare), so this
# only fires for backend changes (or a manual run). It SSHes into the VM, pulls
# the latest code, rebuilds the Docker image, restarts the container, and health-
# checks it.
#
# Requires three repo secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST         → the VM's public IP (e.g. 129.154.254.80)
#   SSH_USER         → ubuntu
#   SSH_PRIVATE_KEY  → a deploy private key whose PUBLIC half is in the VM's
#                      ~/.ssh/authorized_keys

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # contents:read lets the auto-provided GITHUB_TOKEN fetch the repo (needed
    # now the repo is private — an unauthenticated HTTPS fetch on the VM fails
    # with "could not read Username for 'https://github.com'").
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Encryption secret for AI provider keys at rest. Add it as a repo
          # secret (Settings → Secrets and variables → Actions). If it's left
          # unset, the app still runs fine with keys unencrypted (see #718).
          AI_KEY_ENC_SECRET: ${{ secrets.AI_KEY_ENC_SECRET }}
          # Short-lived token (auto-provided by Actions, valid only for this run)
          # used to authenticate the git fetch on the VM. Works whether the repo
          # is public or private, so no PAT/deploy key or VM credential is needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script_stop: true
          envs: AI_KEY_ENC_SECRET,GH_TOKEN,GH_REPO
          script: |
            set -e
            cd ~/My-Study-Guide
            # Fetch over an authenticated HTTPS URL rather than the VM's stored
            # `origin` credentials. `x-access-token:<GITHUB_TOKEN>` is accepted by
            # github.com for both public and private repos, so the deploy no
            # longer depends on any credential being configured on the VM.
            git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" main
            # Hard reset to the fetched main. This updates only tracked files;
            # the untracked backend/msg.env (your secrets) is left untouched.
            git reset --hard FETCH_HEAD
            cd backend
            sudo docker build -t msg-backend .
            sudo docker rm -f msg-backend || true
            # AI_KEY_ENC_SECRET encrypts stored AI provider keys at rest. Only
            # pass -e when the CI secret is actually set: a command-line -e
            # OVERRIDES --env-file, so a missing/blank repo secret would otherwise
            # inject an empty value, wipe the real secret from msg.env, and make
            # EVERY saved AI key undecryptable. When it's blank we skip the -e and
            # fall back to whatever msg.env provides.
            if [ -n "$AI_KEY_ENC_SECRET" ]; then
              sudo docker run -d --name msg-backend --restart always \
                --env-file msg.env \
                -e AI_KEY_ENC_SECRET="$AI_KEY_ENC_SECRET" \
                -p 127.0.0.1:5000:5000 msg-backend
            else
              echo "⚠️  AI_KEY_ENC_SECRET repo secret is empty — not overriding; using the value from msg.env (if any)."
              sudo docker run -d --name msg-backend --restart always \
                --env-file msg.env \
                -p 127.0.0.1:5000:5000 msg-backend
            fi
            sudo docker image prune -f
            # Give it a moment to boot, then verify it's healthy.
            sleep 6
            if curl -fsS http://127.0.0.1:5000/api/health >/dev/null; then
              echo "✅ Health check passed — deploy succeeded."
            else
              echo "❌ Health check FAILED after deploy."
              sudo docker logs --tail 40 msg-backend || true
              exit 1
            fi
