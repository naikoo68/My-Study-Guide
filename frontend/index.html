<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Move visitors off the legacy *.vercel.app URL onto the custom domain.
         Runs before anything else so it works even when the page is served
         from the PWA / service-worker cache (which a server-side redirect in
         vercel.json can't reach). No-op on the real domain and on Vercel
         preview deployments (their hostnames don't match). -->
    <script>
      (function () {
        try {
          if (window.location.hostname === "mystudyguideme.vercel.app") {
            var l = window.location;
            window.location.replace(
              "https://www.mystudyguide.in" + l.pathname + l.search + l.hash
            );
          }
        } catch (e) {
          /* never let this block the app from loading */
        }
      })();
    </script>

    <!-- Guard against the "Failed to execute 'removeChild' / 'insertBefore' on
         'Node'" crash that browser page-translation (Google / Brave Translate)
         triggers by swapping out React-managed text nodes. If the target's
         parent no longer matches, no-op instead of throwing so the app keeps
         running. Applied before React loads. See facebook/react#11538. -->
    <script>
      (function () {
        if (typeof Node !== "function" || !Node.prototype) return;
        var realRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child.parentNode !== this) return child;
          return realRemoveChild.apply(this, arguments);
        };
        var realInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) return newNode;
          return realInsertBefore.apply(this, arguments);
        };
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Installable PWA (client "My Practice" app) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="My Practice" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SPA deep-link restore: if 404.html bounced here with the original path
         encoded as "?/...", rewrite the URL back to that path BEFORE the app
         boots, so refreshing a client-side route keeps you on that route
         instead of landing on the home page. No-op on normal visits. -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) { return s.replace(/~and~/g, "&"); })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>

    <!-- Connect to the API backend early to cut request latency -->
    <link rel="preconnect" href="https://my-prep-mart-api-39nk.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://my-prep-mart-api-39nk.onrender.com" />

    <!-- SEO -->
    <title>My Study Guide — Prepare Smart, Achieve More</title>

      name="description"
      content="My Study Guide: subject-wise quizzes, full-length test series, instant results, performance analytics and leaderboards for serious exam aspirants."
    />

    <meta property="og:title" content="My Study Guide — Prepare Smart, Achieve More" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:title" content="My Study Guide — Prepare Smart, Achieve More" />
    <meta name="twitter:description" content="Quizzes, test series and analytics for exam aspirants." />
    <meta name="twitter:image" content="https://www.mystudyguide.in/og-image.png" />
