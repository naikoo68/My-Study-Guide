# Render Blueprint — deploys the My Study Guide backend API from the Dockerfile.
# In Render: New → Blueprint → connect this repo. Render reads this file.
#
# This UPDATES the existing service (the name below is immutable — keep it so the
# live URL doesn't change) to build from backend/Dockerfile instead of a plain
# `npm start`. Secrets use `sync: false` — set/kept in the dashboard, never
# committed. Change DB_ENGINE to mongo/dynamo if you switch databases.
services:
  - type: web
    name: my-prep-mart-api        # MUST stay the same — the service name/URL is immutable
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                    # change to "starter" to add a card / lift the free bandwidth cap
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: JWT_SECRET
        generateValue: true       # Render generates a strong secret automatically

      # ---- Database engine (mongo | oracle | dynamo) ----
      - key: DB_ENGINE
        value: oracle
      # Oracle Autonomous DB (MongoDB API) — used when DB_ENGINE=oracle:
      - key: ORACLE_MONGO_URI
        sync: false
      - key: ORACLE_MAX_POOL
        value: "20"
      # MongoDB — used when DB_ENGINE=mongo:
      - key: MONGO_URI
        sync: false
      # DynamoDB — used when DB_ENGINE=dynamo (leave blank on Oracle):
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DYNAMODB_TABLE_PREFIX
        value: msg_

      # ---- App config ----
      - key: CLIENT_URL
        sync: false               # your Vercel/frontend URL (CORS)
      - key: ADMIN_EMAIL
        sync: false
      - key: TENANT_ENFORCEMENT
        value: "on"               # multi-tenant scoping — keep "on" to match live setup

      # ---- AI Question Generator ----
      - key: AI_API_KEY
        sync: false               # TokenLab (or other) API key — enables "Generate with AI"
      - key: AI_BASE_URL
        value: https://api.tokenlab.sh/v1
      - key: AI_MODEL
        sync: false               # one OR many model ids, comma-separated (first = default)

      # ---- Uploads (Cloudinary) ----
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ---- Email (SMTP) ----
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # ---- Payments (Razorpay) ----
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
