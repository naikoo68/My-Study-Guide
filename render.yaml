# Render Blueprint — deploys the backend from backend/Dockerfile automatically.
# Import once: Render dashboard → New → Blueprint → pick this repo. After that,
# pushes to the default branch auto-deploy.
#
# Secrets & per-deploy values use `sync: false` — Render will PROMPT for them on
# import and store them encrypted (never committed here). Non-secret defaults
# are inline; change DB_ENGINE to mongo/dynamo if you switch databases.
services:
  - type: web
    name: my-study-guide-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free            # change to "starter" to add a card / remove the free bandwidth cap
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: "7d"
      # Generated once by Render and kept stable across deploys.
      - key: JWT_SECRET
        generateValue: true

      # ---- Database engine (mongo | oracle | dynamo) ----
      - key: DB_ENGINE
        value: oracle
      # Oracle Autonomous DB (MongoDB API) — used when DB_ENGINE=oracle:
      - key: ORACLE_MONGO_URI
        sync: false
      - key: ORACLE_MAX_POOL
        value: "20"
      # MongoDB — used when DB_ENGINE=mongo:
      - key: MONGO_URI
        sync: false
      # DynamoDB — used when DB_ENGINE=dynamo (uncomment/add in the dashboard):
      # - key: AWS_REGION
      # - key: AWS_ACCESS_KEY_ID
      # - key: AWS_SECRET_ACCESS_KEY
      # - key: DYNAMODB_TABLE_PREFIX

      # ---- App config / integrations (set in the dashboard) ----
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
